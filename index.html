ottom:15px}.item{border:1px solid var(--b);border-radius:15px;padding:13px;margin:10px 0}.meta{font-size:13px;color:#536174;line-height:1.55;margin-top:5px}.badge{padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}.dep{background:#fef3c7;color:#8a4c00}.cour{background:#dbeafe;color:#1746a2}.pay{background:#dcfce7;color:#166534}.payf{background:#f3e8ff;color:#6b21a8}.msg{padding:10px;border-radius:10px;background:#dbeafe;color:#1746a2;margin:12px 0}.err{background:#fee2e2;color:#991b1b}.bulk{position:sticky;bottom:10px;background:#111827;color:#fff;padding:12px;margin:12px;border-radius:15px}.modal{position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:15px}.modalbox{background:#fff;width:min(820px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #cbd5e1;padding:7px;text-align:left}th{background:#f1f5f9}@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;inset:0}.noprint{display:none!important}}
</style></head><body>
<section id="loginView" class="login"><div class="loginbox"><div class="logo">🚚</div><h1>Livraison Manager</h1><p>Gestion des colis et fournisseurs</p><div class="msg">● Supabase connecté • v13</div><div id="loginErr" class="msg err hide"></div><form id="loginForm"><label>Login</label><input id="login" required placeholder="admin@email.com ou raja" autocomplete="username"><label>Mot de passe</label><input id="pass" type="password" required autocomplete="current-password"><button class="primary" style="width:100%;margin-top:16px">Connexion</button></form></div></section>
<section id="app" class="hide"><header><div><b id="headTitle">Livraison Manager</b><small id="headSub" style="display:block;color:#cbd5e1"></small></div><div class="row"><button class="outline" onclick="loadAll()">🔄</button><button class="danger" onclick="logout()">Déconnexion</button></div></header><main class="wrap"><div id="tabs" class="tabs hide"><button class="tab on" data-t="colis" onclick="tab('colis')">📦 Colis</button><button class="tab" data-t="four" onclick="tab('four')">🏪 Fournisseurs</button><button class="tab" data-t="ctrl" onclick="tab('ctrl')">💵 Contrôle</button></div><div id="stats" class="stats"></div>

<section id="fourSec" class="hide"><div class="card"><h3>Créer un fournisseur</h3><p class="meta">Le fournisseur se connectera directement avec le login et le mot de passe.</p><form id="fourForm" class="grid"><input id="fNom" required placeholder="Nom / Boutique"><input id="fLogin" required minlength="3" pattern="[A-Za-z0-9._-]+" placeholder="Login, ex: raja"><input id="fPass" type="password" required minlength="6" placeholder="Mot de passe (6 caractères minimum)"><button class="primary">Créer le fournisseur</button></form></div><div id="fourList" class="card"></div></section>
<section id="ctrlSec" class="hide"><div class="card"><h3>Contrôle financier</h3><div id="ctrlStats" class="stats"></div><form id="ctrlForm" class="grid"><input id="cLabel" required placeholder="Libellé"><select id="cType"><option value="plus">Ajout (+)</option><option value="moins">Déduction (-)</option></select><input id="cMont" type="number" min=".01" step=".01" required placeholder="Montant DT"><button class="primary">Ajouter</button></form></div><div id="ctrlList" class="card"></div></section></main><div id="bulk" class="bulk hide"><div class="row between"><b><span id="selCount">0</span> sélectionné(s)</b><div class="row"><button onclick="bulkStatus('En dépôt')">Dépôt</button><button onclick="bulkStatus('En cours')">En cours</button><button class="green" onclick="bulkStatus('Payé')">Payé</button><button class="primary" onclick="bulkStatus('Payé Fournisseur')">Payé fournisseur</button><button onclick="bord(true)">Bordereau</button></div></div></div></section>

<script>
const URL='https://pvdtgwxutzfxohzwbyom.supabase.co',KEY='sb_publishable_V03DVtMLcDV59b3cCaLZSA_aKhtFkNJ',sb=supabase.createClient(URL,KEY);let user=null,prof=null,fours=[],colis=[],ctrl=[],selected=new Set();const $=x=>document.getElementById(x),admin=()=>prof?.role==='admin',num=x=>Number(x||0),money=x=>num(x).toFixed(2)+' DT',esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'),date=x=>x?new Date(x).toLocaleString('fr-FR'):'-',wait=(b,on,t='Traitement…')=>{if(!b)return;if(on){b.dataset.old=b.textContent;b.textContent=t;b.disabled=true}else{b.textContent=b.dataset.old||'Valider';b.disabled=false}};
async function q(p,msg){const{data,error}=await p;if(error){console.error(error);throw new Error(msg+': '+error.message)}return data}function needAdmin(){if(!admin()){alert('Action réservée à l’administrateur');return false}return true}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;wait(b,true,'Connexion…');$('loginErr').classList.add('hide');try{const raw=$('login').value.trim().toLowerCase(),email=raw.includes('@')?raw:`${raw}@livraison.local`;const{data,error}=await sb.auth.signInWithPassword({email,password:$('pass').value});if(error)throw error;await start(data.user)}catch(x){$('loginErr').textContent=x.message;$('loginErr').classList.remove('hide')}finally{wait(b,false)}};
async function start(u){user=u;try{prof=await q(sb.from('profiles').select('*').eq('id',u.id).single(),'Profil introuvable');await loadAll();$('loginView').classList.add('hide');$('app').classList.remove('hide');$('tabs').classList.toggle('hide',!admin());document.querySelectorAll('.admin').forEach(x=>x.classList.toggle('hide',!admin()));$('headTitle').textContent=admin()?'Espace Administrateur':prof.nom;$('headSub').textContent=(prof.login||prof.role)+' • Supabase Auth • v13';tab('colis')}catch(x){alert(x.message);await sb.auth.signOut()}}
async function init(){const{data:{session}}=await sb.auth.getSession();if(session)await start(session.user)}async function logout(){await sb.auth.signOut();location.reload()}
async function loadAll(){if(!user)return;try{[fours,colis]=await Promise.all([q(sb.from('profiles').select('id,nom,role,login').eq('role','fournisseur').order('nom'),'Fournisseurs'),q(sb.from('colis').select('*').order('created_at',{ascending:false}),'Colis')]);ctrl=admin()?await q(sb.from('controles_dt').select('*').order('created_at',{ascending:false}),'Contrôle'):[];render()}catch(x){alert(x.message)}}
function tab(t){selected.clear();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));$('colisSec').classList.toggle('hide',t!=='colis');$('fourSec').classList.toggle('hide',t!=='four');$('ctrlSec').classList.toggle('hide',t!=='ctrl');render()}
function render(){$('fourSel').innerHTML=fours.map(x=>`<option value="${esc(x.id)}">${esc(x.nom)}</option>`).join('');$('fourList').innerHTML=fours.map(x=>`<div class="item"><b>${esc(x.nom)}</b><div class="meta">Login: ${esc(x.login||'-')}</div></div>`).join('')||'<p class="meta">Aucun fournisseur.</p>';renderColis();renderCtrl()}
function visible(){let a=admin()?[...colis]:colis.filter(x=>String(x.fournisseur_id)===String(user.id));let s=$('search').value.toLowerCase(),f=$('filter').value;if(f!=='ALL')a=a.filter(x=>x.statut===f);if(s)a=a.filter(x=>[x.client_nom,x.telephone,x.adresse,x.article].some(v=>String(v||'').toLowerCase().includes(s)));return a}function fname(id){return fours.find(x=>String(x.id)===String(id))?.nom||'Fournisseur'}function sc(s){return s==='En dépôt'?'dep':s==='En cours'?'cour':s==='Payé'?'pay':'payf'}
function renderColis(){if(!prof)return;const a=visible(),reste=a.filter(x=>x.statut!=='Payé Fournisseur').reduce((s,x)=>s+num(x.prix_article),0),liv=a.reduce((s,x)=>s+num(x.prix_livraison),0),tot=a.reduce((s,x)=>s+num(x.prix_article)+num(x.prix_livraison),0);$('stats').innerHTML=`<div class="stat"><small>Colis</small><strong>${a.length}</strong></div><div class="stat"><small>Total clients</small><strong>${money(tot)}</strong></div><div class="stat"><small>Livraison</small><strong>${money(liv)}</strong></div><div class="stat"><small>Reste fournisseurs</small><strong>${money(reste)}</strong></div>`;$('list').innerHTML=a.map(x=>{let ck=selected.has(String(x.id));return`<div class="item"><div class="row between"><div>${admin()?`<input style="width:auto" type="checkbox" ${ck?'checked':''} onchange="toggleOne('${x.id}')">`:''} <b>${esc(x.client_nom)} • ${esc(x.telephone)}</b></div><span class="badge ${sc(x.statut)}">${esc(x.statut)}</span></div><div class="meta">🏪 ${esc(fname(x.fournisseur_id))} • 📦 ${esc(x.article)} • 📍 ${esc(x.adresse)}<br>💰 Article: <b>${money(x.prix_article)}</b> • Livraison: ${money(x.prix_livraison)} • Total: <b>${money(num(x.prix_article)+num(x.prix_livraison))}</b><br>🕒 ${date(x.settled_at||x.created_at)}</div>${admin()?`<div class="row" style="margin-top:9px"><select style="width:auto" onchange="statusOne('${x.id}',this.value)">${['En dépôt','En cours','Payé','Payé Fournisseur'].map(s=>`<option ${x.statut===s?'selected':''}>${s}</option>`).join('')}</select><button class="outline" onclick="openEdit('${x.id}')">Modifier</button><button class="danger" onclick="removeColis('${x.id}')">Supprimer</button></div>`:''}</div>`}).join('')||'<p class="meta">Aucun colis.</p>';updateBulk()}
$('colisForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;wait(b,true);try{let item={fournisseur_id:admin()?$('fourSel').value:user.id,client_nom:$('client').value.trim(),telephone:$('tel').value.trim(),adresse:$('adresse').value.trim(),article:$('article').value.trim()||'Colis',prix_article:Math.max(0,num($('prix').value)),prix_livraison:Math.max(0,num($('liv').value)),statut:'En dépôt'};if(!item.fournisseur_id)throw new Error('Créez d’abord un fournisseur');let d=await q(sb.from('colis').insert(item).select().single(),'Ajout impossible');colis.unshift(d);clearColis();renderColis()}catch(x){alert(x.message)}finally{wait(b,false)}};function clearColis(){['client','tel','adresse','article','prix'].forEach(x=>$(x).value='');$('liv').value=8}
async function statusOne(id,statut){if(!needAdmin())return;try{let p={statut,settled_at:statut==='Payé Fournisseur'?new Date().toISOString():null};await q(sb.from('colis').update(p).eq('id',id),'Modification');colis=colis.map(x=>String(x.id)===String(id)?{...x,...p}:x);renderColis()}catch(x){alert(x.message)}}async function removeColis(id){if(!needAdmin()||!confirm('Supprimer ce colis ?'))return;try{await q(sb.from('colis').delete().eq('id',id),'Suppression');colis=colis.filter(x=>String(x.id)!==String(id));renderColis()}catch(x){alert(x.message)}}
function openEdit(id){let x=colis.find(c=>String(c.id)===String(id));['Id','Client','Tel','Adresse','Article','Prix','Liv'].forEach(k=>{$('e'+k).value=k==='Id'?x.id:x[{Client:'client_nom',Tel:'telephone',Adresse:'adresse',Article:'article',Prix:'prix_article',Liv:'prix_livraison'}[k]]});$('editModal').classList.remove('hide')}function closeEdit(){$('editModal').classList.add('hide')}
$('editForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;wait(b,true);try{let id=$('eId').value,p={client_nom:$('eClient').value.trim(),telephone:$('eTel').value.trim(),adresse:$('eAdresse').value.trim(),article:$('eArticle').value.trim()||'Colis',prix_article:num($('ePrix').value),prix_livraison:num($('eLiv').value)};await q(sb.from('colis').update(p).eq('id',id),'Modification');colis=colis.map(x=>String(x.id)===String(id)?{...x,...p}:x);closeEdit();renderColis()}catch(x){alert(x.message)}finally{wait(b,false)}};
function toggleOne(id){selected.has(String(id))?selected.delete(String(id)):selected.add(String(id));renderColis()}function toggleAll(){let a=visible(),all=a.length&&a.every(x=>selected.has(String(x.id)));a.forEach(x=>all?selected.delete(String(x.id)):selected.add(String(x.id)));renderColis()}function updateBulk(){$('selCount').textContent=selected.size;$('bulk').classList.toggle('hide',!admin()||!selected.size)}async function bulkStatus(statut){let ids=[...selected],p={statut,settled_at:statut==='Payé Fournisseur'?new Date().toISOString():null};try{await q(sb.from('colis').update(p).in('id',ids),'Modification groupée');colis=colis.map(x=>selected.has(String(x.id))?{...x,...p}:x);selected.clear();renderColis()}catch(x){alert(x.message)}}
$('fourForm').onsubmit=async e=>{e.preventDefault();if(!needAdmin())return;let b=e.submitter;wait(b,true,'Création…');try{let nom=$('fNom').value.trim(),login=$('fLogin').value.trim().toLowerCase(),password=$('fPass').value;if(!/^[a-z0-9._-]{3,30}$/.test(login))throw new Error('Login invalide');let{data,error}=await sb.functions.invoke('create-fournisseur',{body:{nom,login,password}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Création impossible');fours.push(data.profile);e.target.reset();render();alert('Fournisseur créé. Login: '+login)}catch(x){alert('Création impossible: '+x.message)}finally{wait(b,false)}};
$('ctrlForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;wait(b,true);try{let d=await q(sb.from('controles_dt').insert({label:$('cLabel').value.trim(),type:$('cType').value,montant:Math.abs(num($('cMont').value))}).select().single(),'Ajout');ctrl.unshift(d);e.target.reset();renderCtrl()}catch(x){alert(x.message)}finally{wait(b,false)}};async function delCtrl(id){if(!confirm('Supprimer ?'))return;await q(sb.from('controles_dt').delete().eq('id',id),'Suppression');ctrl=ctrl.filter(x=>String(x.id)!==String(id));renderCtrl()}
function renderCtrl(){if(!admin())return;let dette=colis.filter(x=>x.statut!=='Payé Fournisseur').reduce((s,x)=>s+num(x.prix_article),0),liv=colis.filter(x=>['Payé','Payé Fournisseur'].includes(x.statut)).reduce((s,x)=>s+num(x.prix_livraison),0),plus=ctrl.filter(x=>x.type==='plus').reduce((s,x)=>s+num(x.montant),0),moins=ctrl.filter(x=>x.type==='moins').reduce((s,x)=>s+num(x.montant),0);$('ctrlStats').innerHTML=`<div class="stat"><small>Dette fournisseurs</small><strong>${money(dette)}</strong></div><div class="stat"><small>Livraison encaissée</small><strong>${money(liv)}</strong></div><div class="stat"><small>Ajustements</small><strong>${money(plus-moins)}</strong></div><div class="stat"><small>Solde livreur</small><strong>${money(liv+plus-moins)}</strong></div>`;$('ctrlList').innerHTML=ctrl.map(x=>`<div class="item row between"><div><b>${esc(x.label)}</b><div class="meta">${date(x.created_at)}</div></div><div>${x.type==='plus'?'+':'-'}${money(x.montant)} <button class="danger" onclick="delCtrl('${x.id}')">Supprimer</button></div></div>`).join('')||'<p class="meta">Aucune opération.</p>'}
function bord(only){let a=visible();if(only)a=a.filter(x=>selected.has(String(x.id)));if(!a.length)return alert('Aucun colis');let pa=a.reduce((s,x)=>s+num(x.prix_article),0),pl=a.reduce((s,x)=>s+num(x.prix_livraison),0);$('print').innerHTML=`<h2>Bordereau de livraison</h2><p>${date(new Date())} • ${a.length} colis</p><table><thead><tr><th>#</th><th>Fournisseur</th><th>Client</th><th>Adresse</th><th>Statut</th><th>Article</th><th>Livraison</th><th>Total</th></tr></thead><tbody>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(fname(x.fournisseur_id))}</td><td>${esc(x.client_nom)}<br>${esc(x.telephone)}</td><td>${esc(x.adresse)}</td><td>${esc(x.statut)}</td><td>${money(x.prix_article)}</td><td>${money(x.prix_livraison)}</td><td>${money(num(x.prix_article)+num(x.prix_livraison))}</td></tr>`).join('')}</tbody><tfoot><tr><th colspan="5">Totaux</th><th>${money(pa)}</th><th>${money(pl)}</th><th>${money(pa+pl)}</th></tr></tfoot></table>`;$('bordModal').classList.remove('hide')}function closeBord(){$('bordModal').classList.add('hide')}init();
