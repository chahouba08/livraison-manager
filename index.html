<!doctype html><html lang="fr" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17143d"><title>Livraison Manager v14</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--p:#5145e5;--bg:#f1f5f9;--b:#dbe2ea;--m:#64748b;--g:#16934a;--r:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#101827}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#080b18,#18123c)}.loginbox,.card{background:#fff;border:1px solid var(--b);border-radius:20px;padding:20px;box-shadow:0 5px 20px #0001}.loginbox{width:min(410px,100%);text-align:center;padding:32px 24px}.logo{font-size:36px;background:var(--p);width:68px;height:68px;display:grid;place-items:center;border-radius:20px;margin:auto}input,select{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;background:#f8fafc;font-size:15px}label{display:block;text-align:left;font-weight:700;font-size:12px;margin:14px 0 6px}button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.danger{background:#fee2e2;color:var(--r)}.outline{background:#fff;border:1px solid var(--b)}.green{background:var(--g);color:#fff}button:disabled{opacity:.55}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0d1428,#20184c);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1000px;margin:auto;padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{background:#e2e8f0}.tab.on{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)!important}}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--b);padding:14px;border-radius:16px}.stat small{color:var(--m)}.stat strong{display:block;font-size:20px;margin-top:6px}.card{margin-bottom:15px}.item{border:1px solid var(--b);border-radius:15px;padding:13px;margin:10px 0}.meta{font-size:13px;color:#536174;line-height:1.55;margin-top:5px}.badge{padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}.dep{background:#fef3c7;color:#8a4c00}.cour{background:#dbeafe;color:#1746a2}.pay{background:#dcfce7;color:#166534}.payf{background:#f3e8ff;color:#6b21a8}.msg{padding:10px;border-radius:10px;background:#dbeafe;color:#1746a2;margin:12px 0}.err{background:#fee2e2;color:#991b1b}.bulk{position:sticky;bottom:10px;background:#111827;color:#fff;padding:12px;margin:12px;border-radius:15px}.modal{position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:15px}.modalbox{background:#fff;width:min(820px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #cbd5e1;padding:7px;text-align:left}th{background:#f1f5f9}@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;inset:0}.noprint{display:none!important}}
</style></head><body>
<section id="loginView" class="login"><div class="loginbox"><div class="logo">🚚</div><h1>Livraison Manager</h1><p>Gestion des colis et fournisseurs</p><div class="msg">● Supabase connecté • v14</div><div id="loginErr" class="msg err hide"></div><form id="loginForm"><label>Login</label><input id="login" required autocomplete="off" placeholder="E-mail Admin ou login fournisseur"><label>Mot de passe</label><input id="pass" type="password" required autocomplete="off"><button class="primary" style="width:100%;margin-top:16px">Connexion</button></form></div></section>
<section id="app" class="hide"><header><div><b id="headTitle">Livraison Manager</b><small id="headSub" style="display:block;color:#cbd5e1"></small></div><div class="row"><button class="outline" onclick="loadAll()">🔄</button><button class="danger" onclick="logout()">Déconnexion</button></div></header><main class="wrap"><div id="warning" class="msg err hide"></div><div id="tabs" class="tabs hide"><button class="tab on" data-t="colis" onclick="showTab('colis')">📦 Colis</button><button class="tab" data-t="four" onclick="showTab('four')">🏪 Fournisseurs</button><button class="tab" data-t="ctrl" onclick="showTab('ctrl')">💵 Contrôle</button></div><div id="stats" class="stats"></div>
<section id="colisSec"><div class="card"><div class="row between"><h3>➕ Nouveau colis</h3><button class="outline" onclick="clearColis()">Effacer</button></div><form id="colisForm" class="grid"><select id="fourSel" class="adminOnly"></select><input id="client" required placeholder="Nom client"><input id="tel" required placeholder="Téléphone"><input id="adresse" required placeholder="Adresse / Ville"><input id="article" placeholder="Article"><input id="prix" type="number" min="0" step=".01" required placeholder="Prix article"><input id="liv" type="number" min="0" step=".01" value="8" required placeholder="Livraison"><button class="primary" style="grid-column:1/-1">Enregistrer</button></form></div><div class="card"><div class="row between"><h3>📦 Liste des colis</h3><button class="outline" onclick="openBord(false)">🧾 Bordereau</button></div><div class="grid"><input id="search" oninput="renderColis()" placeholder="Rechercher"><select id="filter" onchange="renderColis()"><option value="ALL">Tous les statuts</option><option>En dépôt</option><option>En cours</option><option>Payé</option><option>Payé Fournisseur</option></select></div><div id="list"></div></div></section>
<section id="fourSec" class="hide"><div class="card"><h3>Créer un fournisseur</h3><form id="fourForm" class="grid"><input id="fNom" required placeholder="Nom / Boutique"><input id="fLogin" required minlength="3" placeholder="Login"><input id="fPass" type="password" required minlength="6" placeholder="Mot de passe"><button class="primary">Créer</button></form></div><div id="fourList" class="card"></div></section>
<section id="ctrlSec" class="hide"><div class="card"><h3>Contrôle financier</h3><div id="ctrlStats" class="stats"></div><form id="ctrlForm" class="grid"><input id="cLabel" required placeholder="Libellé"><select id="cType"><option value="plus">Ajout (+)</option><option value="moins">Déduction (-)</option></select><input id="cMont" type="number" min=".01" step=".01" required placeholder="Montant"><button class="primary">Ajouter</button></form></div><div id="ctrlList" class="card"></div></section></main></section>
<div id="bordModal" class="modal hide"><div class="modalbox"><div class="row between noprint"><h3>Aperçu</h3><div><button class="primary" onclick="print()">Imprimer</button> <button class="danger" onclick="closeBord()">Fermer</button></div></div><div id="print"></div></div></div>
<script>
const SUPABASE_URL='https://pvdtgwxutzfxohzwbyom.supabase.co',KEY='sb_publishable_V03DVtMLcDV59b3cCaLZSA_aKhtFkNJ',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let user=null,profile=null,fours=[],colis=[],ctrl=[];const $=id=>document.getElementById(id),admin=()=>profile?.role==='admin',num=v=>Number(v||0),money=v=>num(v).toFixed(2)+' DT',safe=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'),fmt=v=>v?new Date(v).toLocaleString('fr-FR'):'-';
function busy(b,on,t='Traitement…'){if(!b)return;if(on){b.dataset.old=b.textContent;b.textContent=t;b.disabled=true}else{b.textContent=b.dataset.old||'Valider';b.disabled=false}}function err(t){$('loginErr').textContent=t;$('loginErr').classList.remove('hide')}async function q(p,l){const{data,error}=await p;if(error)throw new Error(l+': '+error.message);return data}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;busy(b,true,'Connexion…');$('loginErr').classList.add('hide');try{const login=$('login').value.trim().toLowerCase(),password=$('pass').value;let signed;if(login.includes('@')){const r=await sb.auth.signInWithPassword({email:login,password});if(r.error)throw r.error;signed=r.data}else{const {data,error}=await sb.functions.invoke('supplier-auth',{body:{action:'login',login,password}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Connexion impossible');const r=await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(r.error)throw r.error;signed=r.data}if(!signed.user)throw new Error('Utilisateur introuvable');await openSession(signed.user)}catch(e2){console.error(e2);err('Connexion impossible : '+e2.message)}finally{busy(b,false)}};
async function openSession(u){user=u;profile=await q(sb.rpc('get_my_profile').single(),'Profil');$('loginView').classList.add('hide');$('app').classList.remove('hide');$('headTitle').textContent=admin()?'Espace Administrateur':profile.nom;$('headSub').textContent=(profile.login||profile.role)+' • v14';$('tabs').classList.toggle('hide',!admin());document.querySelectorAll('.adminOnly').forEach(x=>x.classList.toggle('hide',!admin()));showTab('colis');await loadAll()}
async function init(){const{data:{session}}=await sb.auth.getSession();if(session?.user)await openSession(session.user)}async function logout(){await sb.auth.signOut();location.reload()}
async function loadAll(){const errors=[];try{fours=await q(sb.from('profiles').select('id,nom,role,login').eq('role','fournisseur').order('nom'),'Fournisseurs')}catch(e){fours=[];errors.push(e.message)}try{colis=await q(sb.from('colis').select('*').order('created_at',{ascending:false}),'Colis')}catch(e){colis=[];errors.push(e.message)}if(admin())try{ctrl=await q(sb.from('controles_dt').select('*').order('created_at',{ascending:false}),'Contrôle')}catch(e){ctrl=[];errors.push(e.message)}$('warning').classList.toggle('hide',!errors.length);$('warning').textContent=errors.join(' | ');render()}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));$('colisSec').classList.toggle('hide',t!=='colis');$('fourSec').classList.toggle('hide',t!=='four');$('ctrlSec').classList.toggle('hide',t!=='ctrl');render()}function render(){$('fourSel').innerHTML=fours.map(f=>`<option value="${safe(f.id)}">${safe(f.nom)}</option>`).join('');$('fourList').innerHTML=fours.map(f=>`<div class="item row between"><div><b>${safe(f.nom)}</b><div class="meta">Login: ${safe(f.login)}</div></div><button class="outline" onclick="changePass('${f.id}')">Mot de passe</button></div>`).join('')||'<p class="meta">Aucun fournisseur.</p>';renderColis();renderCtrl()}
function visible(){let a=admin()?[...colis]:colis.filter(c=>String(c.fournisseur_id)===String(user.id));const s=$('search').value.toLowerCase(),f=$('filter').value;if(f!=='ALL')a=a.filter(c=>c.statut===f);if(s)a=a.filter(c=>[c.client_nom,c.telephone,c.adresse,c.article].some(v=>String(v||'').toLowerCase().includes(s)));return a}function fname(id){return fours.find(f=>String(f.id)===String(id))?.nom||'Fournisseur'}function cls(s){return s==='En dépôt'?'dep':s==='En cours'?'cour':s==='Payé'?'pay':'payf'}
function renderColis(){if(!profile)return;const a=visible(),reste=a.filter(c=>c.statut!=='Payé Fournisseur').reduce((s,c)=>s+num(c.prix_article),0),liv=a.reduce((s,c)=>s+num(c.prix_livraison),0),tot=a.reduce((s,c)=>s+num(c.prix_article)+num(c.prix_livraison),0);$('stats').innerHTML=`<div class="stat"><small>Colis</small><strong>${a.length}</strong></div><div class="stat"><small>Total clients</small><strong>${money(tot)}</strong></div><div class="stat"><small>Livraison</small><strong>${money(liv)}</strong></div><div class="stat"><small>Reste fournisseurs</small><strong>${money(reste)}</strong></div>`;$('list').innerHTML=a.map(c=>`<div class="item"><div class="row between"><b>${safe(c.client_nom)} • ${safe(c.telephone)}</b><span class="badge ${cls(c.statut)}">${safe(c.statut)}</span></div><div class="meta">🏪 ${safe(fname(c.fournisseur_id))} • 📦 ${safe(c.article)} • 📍 ${safe(c.adresse)}<br>Article: ${money(c.prix_article)} • Livraison: ${money(c.prix_livraison)} • Total: ${money(num(c.prix_article)+num(c.prix_livraison))}<br>${fmt(c.created_at)}</div>${admin()?`<div class="row"><select style="width:auto" onchange="setStatus('${c.id}',this.value)">${['En dépôt','En cours','Payé','Payé Fournisseur'].map(s=>`<option ${c.statut===s?'selected':''}>${s}</option>`).join('')}</select><button class="danger" onclick="delColis('${c.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class="meta">Aucun colis.</p>'}
$('colisForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;busy(b,true);try{const item={fournisseur_id:admin()?$('fourSel').value:user.id,client_nom:$('client').value.trim(),telephone:$('tel').value.trim(),adresse:$('adresse').value.trim(),article:$('article').value.trim()||'Colis',prix_article:num($('prix').value),prix_livraison:num($('liv').value),statut:'En dépôt'};if(!item.fournisseur_id)throw new Error('Créez un fournisseur');const d=await q(sb.from('colis').insert(item).select().single(),'Ajout');colis.unshift(d);clearColis();renderColis()}catch(x){alert(x.message)}finally{busy(b,false)}};function clearColis(){['client','tel','adresse','article','prix'].forEach(x=>$(x).value='');$('liv').value=8}async function setStatus(id,statut){const p={statut,settled_at:statut==='Payé Fournisseur'?new Date().toISOString():null};await q(sb.from('colis').update(p).eq('id',id),'Modification');colis=colis.map(c=>String(c.id)===String(id)?{...c,...p}:c);renderColis()}async function delColis(id){if(!confirm('Supprimer ?'))return;await q(sb.from('colis').delete().eq('id',id),'Suppression');colis=colis.filter(c=>String(c.id)!==String(id));renderColis()}
$('fourForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;busy(b,true,'Création…');try{const body={action:'create',nom:$('fNom').value.trim(),login:$('fLogin').value.trim().toLowerCase(),password:$('fPass').value};const{data,error}=await sb.functions.invoke('supplier-auth',{body});if(error)throw error;if(!data?.ok)throw new Error(data?.error);fours.push(data.profile);e.target.reset();render();alert('Fournisseur créé')}catch(x){alert('Erreur: '+x.message)}finally{busy(b,false)}};async function changePass(id){const password=prompt('Nouveau mot de passe (6 caractères minimum)');if(!password)return;const{data,error}=await sb.functions.invoke('supplier-auth',{body:{action:'password',user_id:id,password}});if(error||!data?.ok)alert('Erreur');else alert('Mot de passe modifié')}
$('ctrlForm').onsubmit=async e=>{e.preventDefault();const d=await q(sb.from('controles_dt').insert({label:$('cLabel').value.trim(),type:$('cType').value,montant:Math.abs(num($('cMont').value))}).select().single(),'Ajout');ctrl.unshift(d);e.target.reset();renderCtrl()};function renderCtrl(){if(!admin())return;const plus=ctrl.filter(x=>x.type==='plus').reduce((s,x)=>s+num(x.montant),0),moins=ctrl.filter(x=>x.type==='moins').reduce((s,x)=>s+num(x.montant),0);$('ctrlStats').innerHTML=`<div class="stat"><small>Ajustements</small><strong>${money(plus-moins)}</strong></div>`;$('ctrlList').innerHTML=ctrl.map(x=>`<div class="item"><b>${safe(x.label)}</b> ${x.type==='plus'?'+':'-'}${money(x.montant)}</div>`).join('')||'<p class="meta">Aucune opération.</p>'}
function openBord(){const a=visible();if(!a.length)return alert('Aucun colis');$('print').innerHTML=`<h2>Bordereau</h2><table><thead><tr><th>#</th><th>Client</th><th>Statut</th><th>Total</th></tr></thead><tbody>${a.map((c,i)=>`<tr><td>${i+1}</td><td>${safe(c.client_nom)}</td><td>${safe(c.statut)}</td><td>${money(num(c.prix_article)+num(c.prix_livraison))}</td></tr>`).join('')}</tbody></table>`;$('bordModal').classList.remove('hide')}function closeBord(){$('bordModal').classList.add('hide')}init();
</script></body></html>
