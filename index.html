<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17143d">
<title>Livraison Manager v13 final</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#5145e5;--bg:#f1f5f9;--b:#dbe2ea;--m:#64748b;--g:#16934a;--r:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#101827}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#080b18,#18123c)}.loginbox,.card{background:#fff;border:1px solid var(--b);border-radius:20px;padding:20px;box-shadow:0 5px 20px #0001}.loginbox{width:min(410px,100%);text-align:center;padding:32px 24px}.logo{font-size:36px;background:var(--p);width:68px;height:68px;display:grid;place-items:center;border-radius:20px;margin:auto}input,select{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;background:#f8fafc;font-size:15px}label{display:block;text-align:left;font-weight:700;font-size:12px;margin:14px 0 6px}button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:white}.danger{background:#fee2e2;color:var(--r)}.outline{background:#fff;border:1px solid var(--b)}.green{background:var(--g);color:#fff}button:disabled{opacity:.55}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0d1428,#20184c);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1000px;margin:auto;padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{background:#e2e8f0}.tab.on{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)!important}}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--b);padding:14px;border-radius:16px}.stat small{color:var(--m)}.stat strong{display:block;font-size:20px;margin-top:6px}.card{margin-bottom:15px}.item{border:1px solid var(--b);border-radius:15px;padding:13px;margin:10px 0}.meta{font-size:13px;color:#536174;line-height:1.55;margin-top:5px}.badge{padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}.dep{background:#fef3c7;color:#8a4c00}.cour{background:#dbeafe;color:#1746a2}.pay{background:#dcfce7;color:#166534}.payf{background:#f3e8ff;color:#6b21a8}.msg{padding:10px;border-radius:10px;background:#dbeafe;color:#1746a2;margin:12px 0}.err{background:#fee2e2;color:#991b1b}.bulk{position:sticky;bottom:10px;background:#111827;color:#fff;padding:12px;margin:12px;border-radius:15px}.modal{position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:15px}.modalbox{background:#fff;width:min(820px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #cbd5e1;padding:7px;text-align:left}th{background:#f1f5f9}@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;inset:0}.noprint{display:none!important}}
</style></head><body>
<section id="loginView" class="login"><div class="loginbox"><div class="logo">🚚</div><h1>Livraison Manager</h1><p>Gestion des colis et fournisseurs</p><div class="msg">● Supabase connecté • v13 final</div><div id="loginErr" class="msg err hide"></div><form id="loginForm"><label>Login</label><input id="login" required placeholder="E-mail admin ou login fournisseur" autocomplete="off"><label>Mot de passe</label><input id="pass" type="password" required autocomplete="off"><button class="primary" style="width:100%;margin-top:16px">Connexion</button></form></div></section>
<section id="app" class="hide"><header><div><b id="headTitle">Livraison Manager</b><small id="headSub" style="display:block;color:#cbd5e1"></small></div><div class="row"><button class="outline" onclick="loadAll()">🔄</button><button class="danger" onclick="logout()">Déconnexion</button></div></header><main class="wrap"><div id="loadWarning" class="msg err hide"></div><div id="tabs" class="tabs hide"><button class="tab on" data-t="colis" onclick="showTab('colis')">📦 Colis</button><button class="tab" data-t="four" onclick="showTab('four')">🏪 Fournisseurs</button><button class="tab" data-t="ctrl" onclick="showTab('ctrl')">💵 Contrôle</button></div><div id="stats" class="stats"></div>
<section id="colisSec"><div class="card"><div class="row between"><h3>➕ Nouveau colis</h3><button class="outline" onclick="clearColis()">Effacer</button></div><form id="colisForm" class="grid"><select id="fourSel" class="adminOnly"></select><input id="client" required placeholder="Nom du client"><input id="tel" required placeholder="Téléphone"><input id="adresse" required placeholder="Adresse / Ville"><input id="article" placeholder="Article / Désignation"><input id="prix" type="number" min="0" step=".01" required placeholder="Prix article (DT)"><input id="liv" type="number" min="0" step=".01" value="8" required placeholder="Livraison (DT)"><button class="primary" style="grid-column:1/-1">Enregistrer le colis</button></form></div><div class="card"><div class="row between"><h3>📦 Liste des colis</h3><button class="outline" onclick="openBord(false)">🧾 Bordereau</button></div><div class="grid"><input id="search" oninput="renderColis()" placeholder="Rechercher"><select id="filter" onchange="renderColis()"><option value="ALL">Tous les statuts</option><option>En dépôt</option><option>En cours</option><option>Payé</option><option>Payé Fournisseur</option></select></div><button class="outline adminOnly" style="margin-top:10px" onclick="toggleAll()">Tout sélectionner</button><div id="list"></div></div></section>
<section id="fourSec" class="hide"><div class="card"><h3>Créer un fournisseur</h3><form id="fourForm" class="grid"><input id="fNom" required placeholder="Nom / Boutique"><input id="fLogin" required minlength="3" pattern="[A-Za-z0-9._-]+" placeholder="Login, ex: raja"><input id="fPass" type="password" required minlength="6" placeholder="Mot de passe"><button class="primary">Créer le fournisseur</button></form></div><div id="fourList" class="card"></div></section>
<section id="ctrlSec" class="hide"><div class="card"><h3>Contrôle financier</h3><div id="ctrlStats" class="stats"></div><form id="ctrlForm" class="grid"><input id="cLabel" required placeholder="Libellé"><select id="cType"><option value="plus">Ajout (+)</option><option value="moins">Déduction (-)</option></select><input id="cMont" type="number" min=".01" step=".01" required placeholder="Montant DT"><button class="primary">Ajouter</button></form></div><div id="ctrlList" class="card"></div></section></main><div id="bulk" class="bulk hide"><div class="row between"><b><span id="selCount">0</span> sélectionné(s)</b><div class="row"><button onclick="bulkStatus('En dépôt')">Dépôt</button><button onclick="bulkStatus('En cours')">En cours</button><button class="green" onclick="bulkStatus('Payé')">Payé</button><button class="primary" onclick="bulkStatus('Payé Fournisseur')">Payé fournisseur</button></div></div></div></section>
<div id="editModal" class="modal hide"><div class="modalbox"><div class="row between"><h3>Modifier</h3><button class="danger" onclick="closeEdit()">Fermer</button></div><form id="editForm" class="grid"><input id="eId" type="hidden"><input id="eClient" required><input id="eTel" required><input id="eAdresse" required><input id="eArticle"><input id="ePrix" type="number" step=".01" required><input id="eLiv" type="number" step=".01" required><button class="primary" style="grid-column:1/-1">Enregistrer</button></form></div></div>
<div id="bordModal" class="modal hide"><div class="modalbox"><div class="row between noprint"><h3>Aperçu</h3><div><button class="primary" onclick="print()">Imprimer / PDF</button> <button class="danger" onclick="closeBord()">Fermer</button></div></div><div id="print"></div></div></div>
<script>
const SUPABASE_URL='https://pvdtgwxutzfxohzwbyom.supabase.co';
const SUPABASE_KEY='sb_publishable_V03DVtMLcDV59b3cCaLZSA_aKhtFkNJ';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentUser=null,profile=null,fournisseurs=[],colis=[],controles=[],selected=new Set();
const $=id=>document.getElementById(id),isAdmin=()=>profile?.role==='admin',n=v=>Number(v||0),money=v=>n(v).toFixed(2)+' DT',safe=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'),fmt=v=>v?new Date(v).toLocaleString('fr-FR'):'-';
function busy(btn,on,text='Traitement…'){if(!btn)return;if(on){btn.dataset.old=btn.textContent;btn.textContent=text;btn.disabled=true}else{btn.textContent=btn.dataset.old||'Valider';btn.disabled=false}}
function showError(text){$('loginErr').textContent=text;$('loginErr').classList.remove('hide')}
async function request(p,label){const {data,error}=await p;if(error)throw new Error(label+' : '+error.message);return data}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;busy(btn,true,'Connexion…');$('loginErr').classList.add('hide');try{const raw=$('login').value.trim().toLowerCase();const email=raw.includes('@')?raw:`${raw}@livraison.local`;const {data,error}=await sb.auth.signInWithPassword({email,password:$('pass').value});if(error)throw error;if(!data.user)throw new Error('Utilisateur introuvable');await openSession(data.user)}catch(err){console.error(err);showError('Connexion impossible : '+err.message)}finally{busy(btn,false)}});
async function openSession(user){currentUser=user;try{profile=await request(sb.rpc('get_my_profile').single(),'Lecture du profil impossible')}catch(err){console.error(err);showError('Authentification réussie, mais profil inaccessible : '+err.message);return}
$('loginView').classList.add('hide');$('app').classList.remove('hide');$('headTitle').textContent=isAdmin()?'Espace Administrateur':profile.nom;$('headSub').textContent=(profile.login||profile.role)+' • Supabase Auth • v13';$('tabs').classList.toggle('hide',!isAdmin());document.querySelectorAll('.adminOnly').forEach(el=>el.classList.toggle('hide',!isAdmin()));showTab('colis');await loadAll()}
async function init(){const {data:{session},error}=await sb.auth.getSession();if(error)showError(error.message);if(session?.user)await openSession(session.user)}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadAll(){$('loadWarning').classList.add('hide');const errors=[];try{fournisseurs=await request(sb.from('profiles').select('id,nom,role,login').eq('role','fournisseur').order('nom'),'Fournisseurs')}catch(e){fournisseurs=[];errors.push(e.message)}try{colis=await request(sb.from('colis').select('*').order('created_at',{ascending:false}),'Colis')}catch(e){colis=[];errors.push(e.message)}if(isAdmin()){try{controles=await request(sb.from('controles_dt').select('*').order('created_at',{ascending:false}),'Contrôle')}catch(e){controles=[];errors.push(e.message)}}if(errors.length){$('loadWarning').textContent='Connexion réussie. Erreur de chargement : '+errors.join(' | ');$('loadWarning').classList.remove('hide')}renderAll()}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));$('colisSec').classList.toggle('hide',t!=='colis');$('fourSec').classList.toggle('hide',t!=='four');$('ctrlSec').classList.toggle('hide',t!=='ctrl');renderAll()}
function renderAll(){$('fourSel').innerHTML=fournisseurs.map(f=>`<option value="${safe(f.id)}">${safe(f.nom)}</option>`).join('');$('fourList').innerHTML=fournisseurs.map(f=>`<div class="item"><b>${safe(f.nom)}</b><div class="meta">Login: ${safe(f.login||'-')}</div></div>`).join('')||'<p class="meta">Aucun fournisseur.</p>';renderColis();renderControle()}
function visibleColis(){let a=isAdmin()?[...colis]:colis.filter(c=>String(c.fournisseur_id)===String(currentUser.id));const q=$('search').value.trim().toLowerCase(),st=$('filter').value;if(st!=='ALL')a=a.filter(c=>c.statut===st);if(q)a=a.filter(c=>[c.client_nom,c.telephone,c.adresse,c.article].some(v=>String(v||'').toLowerCase().includes(q)));return a}
function fourName(id){return fournisseurs.find(f=>String(f.id)===String(id))?.nom||'Fournisseur'}function statusClass(s){return s==='En dépôt'?'dep':s==='En cours'?'cour':s==='Payé'?'pay':'payf'}
function renderColis(){if(!profile)return;const a=visibleColis(),reste=a.filter(c=>c.statut!=='Payé Fournisseur').reduce((s,c)=>s+n(c.prix_article),0),liv=a.reduce((s,c)=>s+n(c.prix_livraison),0),total=a.reduce((s,c)=>s+n(c.prix_article)+n(c.prix_livraison),0);$('stats').innerHTML=`<div class="stat"><small>Colis</small><strong>${a.length}</strong></div><div class="stat"><small>Total clients</small><strong>${money(total)}</strong></div><div class="stat"><small>Livraison</small><strong>${money(liv)}</strong></div><div class="stat"><small>Reste fournisseurs</small><strong>${money(reste)}</strong></div>`;$('list').innerHTML=a.map(c=>{const ck=selected.has(String(c.id));return `<div class="item"><div class="row between"><div>${isAdmin()?`<input style="width:auto" type="checkbox" ${ck?'checked':''} onchange="toggleOne('${c.id}')">`:''} <b>${safe(c.client_nom)} • ${safe(c.telephone)}</b></div><span class="badge ${statusClass(c.statut)}">${safe(c.statut)}</span></div><div class="meta">🏪 ${safe(fourName(c.fournisseur_id))} • 📦 ${safe(c.article)} • 📍 ${safe(c.adresse)}<br>Article: <b>${money(c.prix_article)}</b> • Livraison: ${money(c.prix_livraison)} • Total: <b>${money(n(c.prix_article)+n(c.prix_livraison))}</b><br>${fmt(c.settled_at||c.created_at)}</div>${isAdmin()?`<div class="row" style="margin-top:9px"><select style="width:auto" onchange="changeStatus('${c.id}',this.value)">${['En dépôt','En cours','Payé','Payé Fournisseur'].map(s=>`<option ${c.statut===s?'selected':''}>${s}</option>`).join('')}</select><button class="outline" onclick="openEdit('${c.id}')">Modifier</button><button class="danger" onclick="deleteColis('${c.id}')">Supprimer</button></div>`:''}</div>`}).join('')||'<p class="meta">Aucun colis.</p>';updateBulk()}
$('colisForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;busy(btn,true);try{const item={fournisseur_id:isAdmin()?$('fourSel').value:currentUser.id,client_nom:$('client').value.trim(),telephone:$('tel').value.trim(),adresse:$('adresse').value.trim(),article:$('article').value.trim()||'Colis',prix_article:Math.max(0,n($('prix').value)),prix_livraison:Math.max(0,n($('liv').value)),statut:'En dépôt'};if(!item.fournisseur_id)throw new Error('Créez d’abord un fournisseur');const data=await request(sb.from('colis').insert(item).select().single(),'Ajout impossible');colis.unshift(data);clearColis();renderColis()}catch(err){alert(err.message)}finally{busy(btn,false)}});
function clearColis(){['client','tel','adresse','article','prix'].forEach(id=>$(id).value='');$('liv').value='8'}
async function changeStatus(id,statut){try{const patch={statut,settled_at:statut==='Payé Fournisseur'?new Date().toISOString():null};await request(sb.from('colis').update(patch).eq('id',id),'Modification impossible');colis=colis.map(c=>String(c.id)===String(id)?{...c,...patch}:c);renderColis()}catch(e){alert(e.message)}}
async function deleteColis(id){if(!confirm('Supprimer ce colis ?'))return;try{await request(sb.from('colis').delete().eq('id',id),'Suppression impossible');colis=colis.filter(c=>String(c.id)!==String(id));renderColis()}catch(e){alert(e.message)}}
function openEdit(id){const c=colis.find(x=>String(x.id)===String(id));$('eId').value=c.id;$('eClient').value=c.client_nom;$('eTel').value=c.telephone;$('eAdresse').value=c.adresse;$('eArticle').value=c.article;$('ePrix').value=c.prix_article;$('eLiv').value=c.prix_livraison;$('editModal').classList.remove('hide')}function closeEdit(){$('editModal').classList.add('hide')}
$('editForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;busy(btn,true);try{const id=$('eId').value,patch={client_nom:$('eClient').value.trim(),telephone:$('eTel').value.trim(),adresse:$('eAdresse').value.trim(),article:$('eArticle').value.trim()||'Colis',prix_article:n($('ePrix').value),prix_livraison:n($('eLiv').value)};await request(sb.from('colis').update(patch).eq('id',id),'Modification impossible');colis=colis.map(c=>String(c.id)===String(id)?{...c,...patch}:c);closeEdit();renderColis()}catch(e){alert(e.message)}finally{busy(btn,false)}});
function toggleOne(id){selected.has(String(id))?selected.delete(String(id)):selected.add(String(id));renderColis()}function toggleAll(){const a=visibleColis(),all=a.length&&a.every(c=>selected.has(String(c.id)));a.forEach(c=>all?selected.delete(String(c.id)):selected.add(String(c.id)));renderColis()}function updateBulk(){$('selCount').textContent=selected.size;$('bulk').classList.toggle('hide',!isAdmin()||!selected.size)}async function bulkStatus(statut){try{const ids=[...selected],patch={statut,settled_at:statut==='Payé Fournisseur'?new Date().toISOString():null};await request(sb.from('colis').update(patch).in('id',ids),'Modification groupée impossible');colis=colis.map(c=>selected.has(String(c.id))?{...c,...patch}:c);selected.clear();renderColis()}catch(e){alert(e.message)}}
$('fourForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;busy(btn,true,'Création…');try{const nom=$('fNom').value.trim(),login=$('fLogin').value.trim().toLowerCase(),password=$('fPass').value;if(!/^[a-z0-9._-]{3,30}$/.test(login))throw new Error('Login invalide');const {data,error}=await sb.functions.invoke('create-fournisseur',{body:{nom,login,password}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Création impossible');fournisseurs.push(data.profile);e.target.reset();renderAll();alert('Fournisseur créé : '+login)}catch(e){alert('Création impossible : '+e.message)}finally{busy(btn,false)}});
$('ctrlForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;busy(btn,true);try{const data=await request(sb.from('controles_dt').insert({label:$('cLabel').value.trim(),type:$('cType').value,montant:Math.abs(n($('cMont').value))}).select().single(),'Ajout impossible');controles.unshift(data);e.target.reset();renderControle()}catch(e){alert(e.message)}finally{busy(btn,false)}});
function renderControle(){if(!isAdmin())return;const dette=colis.filter(c=>c.statut!=='Payé Fournisseur').reduce((s,c)=>s+n(c.prix_article),0),liv=colis.filter(c=>['Payé','Payé Fournisseur'].includes(c.statut)).reduce((s,c)=>s+n(c.prix_livraison),0),plus=controles.filter(x=>x.type==='plus').reduce((s,x)=>s+n(x.montant),0),moins=controles.filter(x=>x.type==='moins').reduce((s,x)=>s+n(x.montant),0);$('ctrlStats').innerHTML=`<div class="stat"><small>Dette fournisseurs</small><strong>${money(dette)}</strong></div><div class="stat"><small>Livraison encaissée</small><strong>${money(liv)}</strong></div><div class="stat"><small>Ajustements</small><strong>${money(plus-moins)}</strong></div><div class="stat"><small>Solde livreur</small><strong>${money(liv+plus-moins)}</strong></div>`;$('ctrlList').innerHTML=controles.map(x=>`<div class="item"><b>${safe(x.label)}</b> • ${x.type==='plus'?'+':'-'}${money(x.montant)}<div class="meta">${fmt(x.created_at)}</div></div>`).join('')||'<p class="meta">Aucune opération.</p>'}
function openBord(only){let a=visibleColis();if(only)a=a.filter(c=>selected.has(String(c.id)));if(!a.length)return alert('Aucun colis');const pa=a.reduce((s,c)=>s+n(c.prix_article),0),pl=a.reduce((s,c)=>s+n(c.prix_livraison),0);$('print').innerHTML=`<h2>Bordereau de livraison</h2><p>${fmt(new Date())} • ${a.length} colis</p><table><thead><tr><th>#</th><th>Fournisseur</th><th>Client</th><th>Statut</th><th>Article</th><th>Livraison</th><th>Total</th></tr></thead><tbody>${a.map((c,i)=>`<tr><td>${i+1}</td><td>${safe(fourName(c.fournisseur_id))}</td><td>${safe(c.client_nom)}<br>${safe(c.telephone)}</td><td>${safe(c.statut)}</td><td>${money(c.prix_article)}</td><td>${money(c.prix_livraison)}</td><td>${money(n(c.prix_article)+n(c.prix_livraison))}</td></tr>`).join('')}</tbody><tfoot><tr><th colspan="4">Totaux</th><th>${money(pa)}</th><th>${money(pl)}</th><th>${money(pa+pl)}</th></tr></tfoot></table>`;$('bordModal').classList.remove('hide')}function closeBord(){$('bordModal').classList.add('hide')}
init();
</script></body></html>
